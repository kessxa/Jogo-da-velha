<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogo da velha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="jogo">
    <p class="etiqueta">UM CLÁSSICO PARA DOIS</p>
    <h1>Jogo da velha<span>.</span></h1>
    <p class="descricao">Uma partida, duas pessoas. Quem faz a próxima linha?</p>
    <div class="jogadores" aria-label="Jogadores">
      <div class="jogador ativo" id="jogador-x"><strong class="x">X</strong><span>JOGADOR 1</span></div>
      <div class="jogador" id="jogador-o"><strong class="o">O</strong><span>JOGADOR 2</span></div>
    </div>
    <p class="status" id="status" aria-live="polite">Vez de <strong class="x">X</strong></p>
    <div class="tabuleiro" id="tabuleiro" aria-label="Tabuleiro do jogo da velha"></div>
    <button class="reiniciar" id="reiniciar" type="button">↻ &nbsp; Nova partida</button>
    <p class="rodape">O primeiro a alinhar três símbolos vence.</p>
  </main>
  <script>
    const tabuleiro = Array(9).fill('');
    let jogador = 'X', terminado = false;
    const linhas = [[0,1,2], [3,4,5], [6,7,8], [0,3,6], [1,4,7], [2,5,8], [0,4,8], [2,4,6]];
    const grade = document.getElementById('tabuleiro');
    const status = document.getElementById('status');
    const celulas = tabuleiro.map((_, i) => {
      const botao = document.createElement('button');
      botao.type = 'button'; botao.className = 'celula';
      botao.setAttribute('aria-label', `Casa ${i + 1}, vazia`);
      botao.addEventListener('click', () => jogar(i));
      grade.appendChild(botao); return botao;
    });
    function jogar(i) {
      if (terminado || tabuleiro[i]) return;
      const simbolo = jogador;
      tabuleiro[i] = simbolo;
      celulas[i].textContent = simbolo;
      celulas[i].classList.add(simbolo.toLowerCase());
      celulas[i].setAttribute('aria-label', `Casa ${i + 1}, ${simbolo}`);
        const linha = linhas.find(([a, b, c]) => tabuleiro[a] && tabuleiro[a] === tabuleiro[b] && tabuleiro[a] === tabuleiro[c]);
        if (linha) {
          terminado = true;
          status.innerHTML = `<strong class="${simbolo.toLowerCase()}">${simbolo}</strong> venceu a partida!`;
          linha.forEach(posicao => celulas[posicao].classList.add('vencedora'));
        } else if (tabuleiro.every(Boolean)) {
          terminado = true; status.textContent = 'Deu velha! A partida empatou.';
        } else {
          jogador = simbolo === 'X' ? 'O' : 'X';
          status.innerHTML = `Vez de <strong class="${jogador.toLowerCase()}">${jogador}</strong>`;
        }
        document.getElementById('jogador-x').classList.toggle('ativo', !terminado && jogador === 'X');
        document.getElementById('jogador-o').classList.toggle('ativo', !terminado && jogador === 'O');
    }
    document.getElementById('reiniciar').addEventListener('click', () => {
      tabuleiro.fill(''); jogador = 'X'; terminado = false;
      celulas.forEach((celula, i) => { celula.textContent = ''; celula.className = 'celula'; celula.setAttribute('aria-label', `Casa ${i + 1}, vazia`); });
      status.innerHTML = 'Vez de <strong class="x">X</strong>';
      document.getElementById('jogador-x').classList.add('ativo');
      document.getElementById('jogador-o').classList.remove('ativo');
    });
  </script>
</body>
</html>
