<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogo da velha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="jogo">
    <p class="etiqueta">UM CLÁSSICO PARA DOIS</p>
    <h1>Jogo da velha<span>.</span></h1>
    <p class="descricao">Escolha seu desafio e faça a próxima linha.</p>
    <div class="modos" role="group" aria-label="Modo de jogo">
      <button type="button" class="modo selecionado" id="modo-pessoas" aria-pressed="true">2 jogadores</button>
      <button type="button" class="modo" id="modo-ia" aria-pressed="false">Contra o computador</button>
    </div>
    <div class="jogadores" aria-label="Jogadores">
      <div class="jogador ativo" id="jogador-x"><strong class="x">X</strong><span>JOGADOR 1</span></div>
      <div class="jogador" id="jogador-o"><strong class="o">O</strong><span id="nome-o">JOGADOR 2</span></div>
    </div>
    <p class="status" id="status" aria-live="polite">Vez de <strong class="x">X</strong></p>
    <div class="tabuleiro" id="tabuleiro" aria-label="Tabuleiro do jogo da velha"></div>
    <button class="reiniciar" id="reiniciar" type="button">↻ &nbsp; Nova partida</button>
    <p class="rodape">O primeiro a alinhar três símbolos vence.</p>
  </main>
  <script>
    const tabuleiro = Array(9).fill('');
    let jogador = 'X', terminado = false, contraIA = false;
    const linhas = [[0,1,2], [3,4,5], [6,7,8], [0,3,6], [1,4,7], [2,5,8], [0,4,8], [2,4,6]];
    function vencedor(casas) {
      const linha = linhas.find(([a,b,c]) => casas[a] && casas[a] === casas[b] && casas[a] === casas[c]);
      return linha ? casas[linha[0]] : null;
    }
    function pontuar(casas, vez, profundidade) {
      const ganhou = vencedor(casas);
      if (ganhou) return ganhou === 'O' ? 10 - profundidade : profundidade - 10;
      if (casas.every(Boolean)) return 0;
      const notas = [];
      casas.forEach((casa, i) => {
        if (!casa) {
          casas[i] = vez;
          notas.push(pontuar(casas, vez === 'O' ? 'X' : 'O', profundidade + 1));
          casas[i] = '';
        }
      });
      return vez === 'O' ? Math.max(...notas) : Math.min(...notas);
    }
    function jogadaIA() {
      let melhor = -Infinity, escolha = -1;
      tabuleiro.forEach((casa, i) => {
        if (!casa) {
          tabuleiro[i] = 'O';
          const nota = pontuar(tabuleiro, 'X', 0);
          tabuleiro[i] = '';
          if (nota > melhor) { melhor = nota; escolha = i; }
        }
      });
      if (escolha >= 0) jogar(escolha);
    }
    const grade = document.getElementById('tabuleiro');
    const status = document.getElementById('status');
    const celulas = tabuleiro.map((_, i) => {
      const botao = document.createElement('button');
      botao.type = 'button'; botao.className = 'celula';
      botao.setAttribute('aria-label', `Casa ${i + 1}, vazia`);
      botao.addEventListener('click', () => jogar(i));
      grade.appendChild(botao); return botao;
    });
    function jogar(i) {
      if (terminado || tabuleiro[i]) return;
      const simbolo = jogador;
      tabuleiro[i] = simbolo;
      celulas[i].textContent = simbolo;
      celulas[i].classList.add(simbolo.toLowerCase());
      celulas[i].setAttribute('aria-label', `Casa ${i + 1}, ${simbolo}`);
        const linha = linhas.find(([a, b, c]) => tabuleiro[a] && tabuleiro[a] === tabuleiro[b] && tabuleiro[a] === tabuleiro[c]);
        if (linha) {
          terminado = true;
          status.innerHTML = `<strong class="${simbolo.toLowerCase()}">${simbolo}</strong> venceu a partida!`;
          linha.forEach(posicao => celulas[posicao].classList.add('vencedora'));
        } else if (tabuleiro.every(Boolean)) {
          terminado = true; status.textContent = 'Deu velha! A partida empatou.';
        } else {
          jogador = simbolo === 'X' ? 'O' : 'X';
          status.innerHTML = `Vez de <strong class="${jogador.toLowerCase()}">${jogador}</strong>`;
        }
        document.getElementById('jogador-x').classList.toggle('ativo', !terminado && jogador === 'X');
        document.getElementById('jogador-o').classList.toggle('ativo', !terminado && jogador === 'O');
        if (contraIA && !terminado && jogador === 'O') jogadaIA();
    }
    function reiniciar() {
      tabuleiro.fill(''); jogador = 'X'; terminado = false;
      celulas.forEach((celula, i) => { celula.textContent = ''; celula.className = 'celula'; celula.setAttribute('aria-label', `Casa ${i + 1}, vazia`); });
      status.innerHTML = 'Vez de <strong class="x">X</strong>';
      document.getElementById('jogador-x').classList.add('ativo');
      document.getElementById('jogador-o').classList.remove('ativo');
    }
    document.getElementById('reiniciar').addEventListener('click', reiniciar);
    function escolherModo(ia) {
      contraIA = ia;
      document.getElementById('modo-pessoas').classList.toggle('selecionado', !ia);
      document.getElementById('modo-ia').classList.toggle('selecionado', ia);
      document.getElementById('modo-pessoas').setAttribute('aria-pressed', String(!ia));
      document.getElementById('modo-ia').setAttribute('aria-pressed', String(ia));
      document.getElementById('nome-o').textContent = ia ? 'COMPUTADOR' : 'JOGADOR 2';
      reiniciar();
    }
    document.getElementById('modo-pessoas').addEventListener('click', () => escolherModo(false));
    document.getElementById('modo-ia').addEventListener('click', () => escolherModo(true));
  </script>
</body>
</html>
